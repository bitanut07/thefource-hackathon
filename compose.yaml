name: zalo-service-navigator

# Chỉ dùng cho phát triển local; chưa phải cấu hình triển khai production.

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  ENABLE_DOCS: ${ENABLE_DOCS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  REGISTRY_DATA_PATH: ${REGISTRY_DATA_PATH:-data/registry/services.real.json}
  RAG_DATA_PATH: ${RAG_DATA_PATH:-data/rag/service-catalog.sqlite3}
  SEARCH_BACKEND: ${SEARCH_BACKEND:-postgres}
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://navigator:${POSTGRES_PASSWORD:-navigator-local-only}@postgres:5432/${POSTGRES_DB:-navigator}}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-false}
  REDIS_URL: redis://redis:6379/0
  RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-zalo-navigator}
  ZALO_API_BASE_URL: ${ZALO_API_BASE_URL:-}
  ZALO_APP_ID: ${ZALO_APP_ID:-}
  ZALO_OA_ID: ${ZALO_OA_ID:-}
  ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
  ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET:-}
  ZALO_ACCESS_TOKEN: ${ZALO_ACCESS_TOKEN:-}
  ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  NAVIGATOR_API_KEY: ${NAVIGATOR_API_KEY:-}
  NAVIGATOR_MAX_CONCURRENCY: ${NAVIGATOR_MAX_CONCURRENCY:-4}
  NAVIGATOR_QUEUE_TIMEOUT_SECONDS: ${NAVIGATOR_QUEUE_TIMEOUT_SECONDS:-0.1}
  STT_PROVIDER: ${STT_PROVIDER:-disabled}
  STT_API_KEY: ${STT_API_KEY:-}
  ALLOWED_LAUNCH_HOSTS: ${ALLOWED_LAUNCH_HOSTS:-zalo.me}
  AUDIO_RETENTION_SECONDS: ${AUDIO_RETENTION_SECONDS:-900}
  UID_HASH_SALT: ${UID_HASH_SALT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: zalo-service-navigator:local
  restart: unless-stopped
  init: true
  environment: *app-environment
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  api:
    <<: *app-service
    command:
      - uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app-service
    command: ["zsn-worker"]
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD-SHELL
        - rq info --url "$$REDIS_URL" >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navigator}
      POSTGRES_USER: ${POSTGRES_USER:-navigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigator-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_service_catalog.sql:/docker-entrypoint-initdb.d/001_service_catalog.sql:ro
      - ./db/migrations/002_zalo_channels_only.sql:/docker-entrypoint-initdb.d/002_zalo_channels_only.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis_data:
  postgres_data:
