name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, typecheck, compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --link-mode copy

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src tests

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests scripts

      - name: Validate runtime registry data
        run: uv run python scripts/seed_registry.py

      - name: Validate runtime launch URLs
        env:
          ALLOWED_LAUNCH_HOSTS: zalo.me,oa.zalo.me,www.vio.edu.vn,www.matsaigon.com,cskh.evnhcmc.vn
        run: uv run python scripts/verify_links.py --require-allowlist

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --link-mode copy

      - name: Run tests
        run: uv run pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: zalo-service-navigator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
